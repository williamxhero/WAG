name: WAG reliability gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/wag-playwright
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix gateway ci --ignore-scripts --no-audit --no-fund
      - run: node --check gateway/server.mjs
      - run: node --check gateway/eval-runner.mjs
      - run: node --check proxy/server.mjs
      - run: npm --prefix runtime/playwright-mcp ci --ignore-scripts --no-audit --no-fund
      - run: node runtime/playwright-mcp/node_modules/playwright/cli.js install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked crawler API fixture dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          packages = {'fastapi', 'pydantic', 'uvicorn'}
          requirements = [line for line in Path('config/crawl4ai-requirements.lock').read_text().splitlines() if line.split('==')[0] in packages]
          subprocess.run([sys.executable, '-m', 'pip', 'install', *requirements], check=True)
          PY
      - run: npm --prefix gateway test
      - run: node --test proxy/*.test.mjs
      - run: for script in scripts/healthcheck.sh scripts/deploy.sh scripts/eval-smoke.sh scripts/cleanup-artifacts.sh scripts/install-artifact-cleanup.sh scripts/bootstrap.sh; do bash -n "$script" || exit; done
      - run: python3 scripts/bootstrap.test.py
      - name: Offline runtime release transaction fixtures
        run: python3 scripts/deploy.test.py
      - name: Python syntax without cache artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for file in Path('scripts').glob('*.py'):
              compile(file.read_bytes(), str(file), 'exec')
          PY
