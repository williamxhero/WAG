name: WAG reliability gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix gateway ci --ignore-scripts --no-audit --no-fund
      - run: node --check gateway/server.mjs
      - run: node --check gateway/eval-runner.mjs
      - run: node --check proxy/server.mjs
      - run: npm --prefix gateway test
      - run: node --test proxy/server.test.mjs
      - run: for script in scripts/healthcheck.sh scripts/deploy.sh scripts/eval-smoke.sh scripts/cleanup-artifacts.sh scripts/install-artifact-cleanup.sh scripts/bootstrap.sh; do bash -n "$script" || exit; done
      - run: python3 scripts/bootstrap.test.py
