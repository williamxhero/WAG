name: WAG reliability gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/wag-playwright
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Approved locked provisioning is separate from deterministic acceptance.
      - name: Provision locked gateway packages
        run: npm --prefix gateway ci --ignore-scripts --no-audit --no-fund
      - name: Provision locked browser packages and isolated Chromium
        run: |
          npm --prefix runtime/playwright-mcp ci --ignore-scripts --no-audit --no-fund
          node runtime/playwright-mcp/node_modules/playwright/cli.js install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked crawler API fixture dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          packages = {'fastapi', 'pydantic', 'uvicorn', 'PyYAML'}
          requirements = [line for line in Path('config/crawl4ai-requirements.lock').read_text().splitlines() if line.split('==')[0] in packages]
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--constraint', 'config/crawl4ai-requirements.lock', *requirements], check=True)
          PY
      - name: Syntax-check every tracked shell and JavaScript file
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(git ls-files -z '*.sh')
          while IFS= read -r -d '' module; do node --check "$module"; done < <(git ls-files -z '*.mjs' '*.js')
      - name: Syntax-check every tracked Python file without cache artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for name in subprocess.check_output(['git', 'ls-files', '-z', '*.py']).split(b'\0'):
              if name:
                  file = Path(name.decode())
                  compile(file.read_bytes(), str(file), 'exec')
          PY
      - name: Deterministic gateway, evaluator, UI, health and shared-proxy acceptance
        # Serialize process-heavy files; explicit in-test concurrency remains intact.
        run: node --test --test-concurrency=1 gateway/*.test.mjs proxy/*.test.mjs
      - name: Deterministic bootstrap, coordinated release and overlay CLI acceptance
        env:
          WAG_OFFLINE_EVIDENCE_DIR: ${{ github.workspace }}/reports/offline-release
        run: |
          set -euo pipefail
          for test in scripts/*.test.py; do python3 "$test"; done
      - name: Deterministic crawler lifecycle and readiness acceptance
        run: python3 -m unittest discover --start-directory crawl4ai --pattern '*_test.py'
      - name: Retain sanitized offline release evidence (not live acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wag-offline-release-evidence
          path: reports/offline-release
          if-no-files-found: error
          retention-days: 30
