<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Conflicting publication dates</title>
    <!-- The meta declares one date... -->
    <meta property="article:published_time" content="2026-10-08T10:00:00+00:00">
    <!-- ...and the JSON-LD declares a different one. Both must be recorded, not silently merged. -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"NewsArticle","datePublished":"2024-11-28T10:35:33+09:00"}
    </script>
  </head>
  <body>
    <article><h1>Conflicting publication dates</h1><p>body</p></article>
  </body>
</html>
