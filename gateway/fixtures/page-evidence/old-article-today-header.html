<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Asia Daily: recirculated 2024 story on a today header</title>
    <meta property="og:site_name" content="Asia Daily">
    <!-- The publisher's own declared publication time (2024). It must win. -->
    <meta property="article:published_time" content="2024-11-28T10:35:33+09:00">
  </head>
  <body>
    <header>
      <nav>
        <!-- A page-header clock that shows "today". It is not inside an <article>, declares no
             itemprop/pubdate, and must never become the publication date. -->
        <span class="today">Today &middot; <time datetime="2026-10-09T00:00:00+00:00">2026-10-09</time></span>
      </nav>
    </header>
    <main>
      <article>
        <h1>An old story that recirculated today</h1>
        <p>Body text of a story first published in 2024 but surfaced again today.</p>
      </article>
      <aside class="recommendations">
        <ul>
          <!-- Recommendation-bar times are not publication dates either. -->
          <li><time datetime="2026-10-09T08:15:00+00:00">08:15 today</time> Trending now</li>
        </ul>
      </aside>
    </main>
  </body>
</html>
