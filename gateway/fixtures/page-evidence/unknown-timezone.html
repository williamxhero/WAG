<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Timezone-less publisher time</title>
    <meta property="og:site_name" content="No TZ Times">
    <!-- A publisher publication time with no timezone. The civil date is real; the exact UTC
         moment is unknown and must never be invented. -->
    <meta property="article:published_time" content="2026-10-08 21:30:00">
  </head>
  <body>
    <article><h1>Timezone-less publisher time</h1><p>body</p></article>
  </body>
</html>
